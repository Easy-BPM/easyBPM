services:
  postgres:
    image: postgres:15
    container_name: Easy_BPM_Postgres
    environment:
      POSTGRES_USER: meu_usuario
      POSTGRES_PASSWORD: minha_senha
      POSTGRES_DB: easybpm
    ports:
      - "5432:5432"
    volumes:
      - ./initdb:/docker-entrypoint-initdb.d
      - pg_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: Easy_BPM_RabbitMQ
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: easybpm
      RABBITMQ_DEFAULT_PASS: easybpm
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: Easy_BPM_Backend
    environment:
      EASY_BPM_SERVER_PORT: "8080"
      EASY_BPM_SERVER_DATASOURCE_URL: jdbc:postgresql://postgres:5432/easybpm
      EASY_BPM_SERVER_DATASOURCE_USERNAME: meu_usuario
      EASY_BPM_SERVER_DATASOURCE_PASSWORD: minha_senha
      EASY_BPM_SERVER_RABBITMQ_HOST: rabbitmq
      EASY_BPM_SERVER_SECURITY_JWT_EXPIRATION_MS: "86400000"
      EASY_BPM_SERVER_TEST_DATA_ENABLED: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sh -c "java -jar /app/app.jar --server.port=8080"
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - rabbitmq
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: Easy_BPM_Worker
    environment:
      EASY_BPM_WORKER_DATASOURCE_URL: jdbc:postgresql://postgres:5432/easybpm
      EASY_BPM_WORKER_DATASOURCE_USERNAME: meu_usuario
      EASY_BPM_WORKER_DATASOURCE_PASSWORD: minha_senha
      EASY_BPM_WORKER_RABBITMQ_HOST: rabbitmq
    depends_on:
      - postgres
      - rabbitmq
      - backend
    restart: unless-stopped

  easy-bpm-admin:
    image: node:22
    container_name: Easy_BPM_Admin
    working_dir: /app
    volumes:
      - ./easy-bpm-admin:/app
      - admin_node_modules:/app/node_modules
    environment:
      - EASY_BPM_ADMIN_API_BASE_URL=http://localhost:8080
    command: sh -c "npm install --force && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    restart: unless-stopped
    depends_on:
      - backend

  easy-bpm-task-portal:
    image: node:22
    container_name: Easy_BPM_Task_Portal
    working_dir: /app
    volumes:
      - ./easy-bpm-task-portal:/app
      - portal_node_modules:/app/node_modules
    environment:
      - EASY_BPM_TASK_PORTAL_API_BASE_URL=http://localhost:8080
    command: sh -c "npm install --force && npm run dev -- --host 0.0.0.0 --port 5174"
    ports:
      - "5174:5174"
    restart: unless-stopped
    depends_on:
      - backend

  easy-bpm-modeler:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.frontend
      args:
        APP_DIR: easy-bpm-modeler
        EASY_BPM_MODELER_API_BASE_URL: http://localhost:8080
        EASY_BPM_MODELER_AGENTIC_ORCHESTRATION: "true"
        EASY_BPM_MODELER_DEFAULT_AI_PROVIDER: ollama
        EASY_BPM_MODELER_DEFAULT_AI_MODEL: llama3.2
        EASY_BPM_MODELER_DEFAULT_AI_CREDENTIAL_REF: ""
    container_name: Easy_BPM_Modeler
    ports:
      - "3000:8080"
    restart: unless-stopped
    depends_on:
      - backend

  # DEV DOCS: temporary docs dev server for local documentation editing.
  # Remove this service from docker-compose.yml when not needed.
  docs:
    image: node:22-bullseye
    container_name: Easy_BPM_Docs
    working_dir: /app
    volumes:
      - ./docs-site-public:/app
      - docs_node_modules:/app/node_modules
    command: sh -c "npm install --force && npm run start -- --host 0.0.0.0 --port 9000"
    ports:
      - "9000:9000"
    restart: unless-stopped

volumes:
  pg_data:
  rabbitmq_data:
  admin_node_modules:
  portal_node_modules:
  docs_node_modules:
