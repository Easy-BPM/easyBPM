apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "easybpm.fullname" . }}-backend
  labels:
    {{- include "easybpm.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "easybpm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "easybpm.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: {{ include "easybpm.image" (merge (dict "image" .Values.backend.image) .) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: EASY_BPM_SERVER_PORT
              value: "8080"
            - name: EASY_BPM_SERVER_LOGGING_LEVEL_APP
              value: {{ .Values.config.loggingLevelComEasyBpm | quote }}
            - name: EASY_BPM_SERVER_MANAGEMENT_HEALTH_SHOW_DETAILS
              value: {{ .Values.config.managementHealthShowDetails | quote }}
            - name: EASY_BPM_SERVER_TEST_DATA_ENABLED
              value: {{ .Values.config.testDataEnabled | quote }}
            - name: EASY_BPM_SERVER_RETENTION_ENABLED
              value: {{ .Values.config.retention.enabled | quote }}
            - name: EASY_BPM_SERVER_RETENTION_COMPLETED_PROCESS_RETENTION_DAYS
              value: {{ .Values.config.retention.completedProcessRetentionDays | quote }}
            - name: EASY_BPM_SERVER_RETENTION_COMPLETED_TASK_RETENTION_DAYS
              value: {{ .Values.config.retention.completedTaskRetentionDays | quote }}
            - name: EASY_BPM_SERVER_RETENTION_BATCH_SIZE
              value: {{ .Values.config.retention.batchSize | quote }}
            - name: EASY_BPM_SERVER_RETENTION_CRON
              value: {{ .Values.config.retention.cron | quote }}
          envFrom:
            - secretRef:
                name: {{ include "easybpm.secretName" . }}
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "easybpm.fullname" . }}-backend
  labels:
    {{- include "easybpm.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
  selector:
    {{- include "easybpm.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
