{{- if and .Values.secrets.create (not .Values.existingSecretName) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "easybpm.secretName" . }}
  labels:
    {{- include "easybpm.labels" . | nindent 4 }}
type: Opaque
stringData:
  EASY_BPM_SERVER_DATASOURCE_URL: {{ .Values.secrets.postgres.url | quote }}
  EASY_BPM_SERVER_DATASOURCE_USERNAME: {{ .Values.secrets.postgres.username | quote }}
  EASY_BPM_SERVER_DATASOURCE_PASSWORD: {{ .Values.secrets.postgres.password | quote }}
  EASY_BPM_SERVER_RABBITMQ_HOST: {{ .Values.secrets.rabbitmq.host | quote }}
  EASY_BPM_SERVER_RABBITMQ_PORT: {{ .Values.secrets.rabbitmq.port | quote }}
  EASY_BPM_SERVER_RABBITMQ_USERNAME: {{ .Values.secrets.rabbitmq.username | quote }}
  EASY_BPM_SERVER_RABBITMQ_PASSWORD: {{ .Values.secrets.rabbitmq.password | quote }}
  EASY_BPM_SERVER_SECURITY_BOOTSTRAP_ADMIN_USERNAME: {{ .Values.secrets.security.adminUsername | quote }}
  EASY_BPM_SERVER_SECURITY_BOOTSTRAP_ADMIN_PASSWORD: {{ .Values.secrets.security.adminPassword | quote }}
  EASY_BPM_SERVER_SECURITY_JWT_SECRET: {{ .Values.secrets.security.jwtSecretBase64 | quote }}
  EASY_BPM_SERVER_AI_ENCRYPTION_KEY: {{ .Values.secrets.ai.encryptionKey | quote }}
  {{- if .Values.secrets.ai.openaiApiKey }}
  OPENAI_API_KEY: {{ .Values.secrets.ai.openaiApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.ai.geminiApiKey }}
  GEMINI_API_KEY: {{ .Values.secrets.ai.geminiApiKey | quote }}
  {{- end }}
  EASY_BPM_WORKER_DATASOURCE_URL: {{ .Values.secrets.postgres.url | quote }}
  EASY_BPM_WORKER_DATASOURCE_USERNAME: {{ .Values.secrets.postgres.username | quote }}
  EASY_BPM_WORKER_DATASOURCE_PASSWORD: {{ .Values.secrets.postgres.password | quote }}
  EASY_BPM_WORKER_RABBITMQ_HOST: {{ .Values.secrets.rabbitmq.host | quote }}
  EASY_BPM_WORKER_RABBITMQ_PORT: {{ .Values.secrets.rabbitmq.port | quote }}
  EASY_BPM_WORKER_RABBITMQ_USERNAME: {{ .Values.secrets.rabbitmq.username | quote }}
  EASY_BPM_WORKER_RABBITMQ_PASSWORD: {{ .Values.secrets.rabbitmq.password | quote }}
{{- end }}
