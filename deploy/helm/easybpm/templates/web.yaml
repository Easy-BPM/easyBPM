{{- $root := . -}}
{{- range $name, $app := dict "admin" .Values.web.admin "modeler" .Values.web.modeler "task-portal" .Values.web.taskPortal }}
{{- if $app.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "easybpm.fullname" $root }}-{{ $name }}
  labels:
    {{- include "easybpm.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "easybpm.selectorLabels" $root | nindent 6 }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "easybpm.selectorLabels" $root | nindent 8 }}
        app.kubernetes.io/component: {{ $name }}
    spec:
      containers:
        - name: {{ $name }}
          image: {{ include "easybpm.image" (merge (dict "image" $app.image) $root) }}
          imagePullPolicy: {{ $root.Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          {{- if eq $name "modeler" }}
          volumeMounts:
            - name: modeler-runtime-config
              mountPath: /usr/share/nginx/html/easybpm-config.js
              subPath: easybpm-config.js
          {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml $root.Values.web.resources | nindent 12 }}
      {{- if eq $name "modeler" }}
      volumes:
        - name: modeler-runtime-config
          configMap:
            name: {{ include "easybpm.fullname" $root }}-modeler-runtime-config
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "easybpm.fullname" $root }}-{{ $name }}
  labels:
    {{- include "easybpm.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ $root.Values.web.service.port }}
      targetPort: http
  selector:
    {{- include "easybpm.selectorLabels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
{{- end }}
{{- end }}
