server {
  listen ${PORT};
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 50m;

  location = / {
    return 302 /ui/modeler/;
  }

  location = /ui/admin {
    return 301 /ui/admin/;
  }

  location = /ui/portal {
    return 301 /ui/portal/;
  }

  location = /ui/modeler {
    return 301 /ui/modeler/;
  }

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location /ui/admin/ {
    try_files $uri $uri/ /ui/admin/index.html;
  }

  location /ui/portal/ {
    try_files $uri $uri/ /ui/portal/index.html;
  }

  location /ui/modeler/ {
    try_files $uri $uri/ /ui/modeler/index.html;
  }

  location ~ ^/(auth|processes|forms|tasks|code-tasks|incidents|admin|api|actuator|v3/api-docs|swagger-ui|swagger-ui.html)(/|$) {
    proxy_pass http://127.0.0.1:${EASY_BPM_SERVER_PORT};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
