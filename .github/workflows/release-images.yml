name: Release Images

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_call:
    inputs:
      ref:
        description: "Git ref to check out before building images."
        required: false
        type: string
      image_tag:
        description: "Image tag to publish when called by the Release workflow."
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}
  DOCKERHUB_IMAGE: nsandi/easybpm

jobs:
  images:
    name: Build and Push Images
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: easybpm-backend
            component: backend
            dockerfile: Dockerfile
            context: .
          - image: easybpm-worker
            component: worker
            dockerfile: Dockerfile.worker
            context: .
          - image: easybpm-admin
            component: admin
            dockerfile: deploy/docker/Dockerfile.frontend
            context: .
            build-args: |
              APP_DIR=easy-bpm-admin
              EASY_BPM_ADMIN_API_BASE_URL=
          - image: easybpm-modeler
            component: modeler
            dockerfile: deploy/docker/Dockerfile.frontend
            context: .
            build-args: |
              APP_DIR=easy-bpm-modeler
              EASY_BPM_MODELER_API_BASE_URL=
          - image: easybpm-task-portal
            component: task-portal
            dockerfile: deploy/docker/Dockerfile.frontend
            context: .
            build-args: |
              APP_DIR=easy-bpm-task-portal
              EASY_BPM_TASK_PORTAL_API_BASE_URL=

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract GHCR image metadata
        id: ghcr-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=${{ inputs.image_tag }},enable=${{ inputs.image_tag != '' }}

      - name: Extract Docker Hub image metadata
        id: dockerhub-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=ref,event=branch,suffix=-${{ matrix.component }}
            type=ref,event=tag,suffix=-${{ matrix.component }}
            type=raw,value=${{ inputs.image_tag }}-${{ matrix.component }},enable=${{ inputs.image_tag != '' }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build-args || '' }}
          push: true
          tags: |
            ${{ steps.ghcr-meta.outputs.tags }}
            ${{ steps.dockerhub-meta.outputs.tags }}
          labels: ${{ steps.ghcr-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
