name: Release Images

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}

jobs:
  images:
    name: Build and Push Images
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: easybpm-backend
            dockerfile: Dockerfile
            context: .
          - image: easybpm-worker
            dockerfile: Dockerfile.worker
            context: .
          - image: easybpm-admin
            dockerfile: deploy/docker/Dockerfile.frontend
            context: .
            build-args: |
              APP_DIR=easy-bpm-admin
              VITE_API_BASE_URL=
          - image: easybpm-modeler
            dockerfile: deploy/docker/Dockerfile.frontend
            context: .
            build-args: |
              APP_DIR=easy-bpm-modeler
              VITE_API_BASE_URL=
          - image: easybpm-task-portal
            dockerfile: deploy/docker/Dockerfile.frontend
            context: .
            build-args: |
              APP_DIR=easy-bpm-task-portal
              VITE_API_BASE_URL=

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=ref,event=tag

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build-args || '' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
