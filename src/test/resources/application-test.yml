spring:
  datasource:
    # These will be overridden by @DynamicPropertySource in test base classes
    url: jdbc:postgresql://localhost:5432/bpm_test
    driver-class-name: org.postgresql.Driver
    username: bpm_user
    password: bpm_password
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
      connection-timeout: 120000
      idle-timeout: 1800000
      max-lifetime: 3600000
      auto-commit: true
      connection-test-query: SELECT 1
  flyway:
    enabled: false
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate.globally_quoted_identifiers: true
      hibernate.jdbc.batch_size: 10
      hibernate.order_inserts: true
      hibernate.order_updates: true
      hibernate.jdbc.fetch_size: 50
      hibernate.show_sql: true
      hibernate.format_sql: true
    show-sql: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

logging:
  level:
    root: WARN
    com.easy.bpm: INFO
    org.hibernate: DEBUG
    org.hibernate.tool.schema: DEBUG
    org.hibernate.tool.schema.internal: DEBUG
    org.hibernate.tool.schema.internal.exec: DEBUG
    org.hibernate.SQL: DEBUG
