spring:
  datasource:
    url: ${EASY_BPM_SERVER_DATASOURCE_URL:jdbc:postgresql://localhost:5432/easybpm}
    username: ${EASY_BPM_SERVER_DATASOURCE_USERNAME:meu_usuario}
    password: ${EASY_BPM_SERVER_DATASOURCE_PASSWORD:minha_senha}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  rabbitmq:
    host: ${EASY_BPM_SERVER_RABBITMQ_HOST:localhost}
    port: ${EASY_BPM_SERVER_RABBITMQ_PORT:5672}
    username: ${EASY_BPM_SERVER_RABBITMQ_USERNAME:easybpm}
    password: ${EASY_BPM_SERVER_RABBITMQ_PASSWORD:easybpm}

server:
  port: ${EASY_BPM_SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: ${EASY_BPM_SERVER_MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,metrics,prometheus}
  endpoint:
    health:
      show-details: ${EASY_BPM_SERVER_MANAGEMENT_HEALTH_SHOW_DETAILS:always}
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        process.execution.duration: true
        node.execution.duration: true
        task.completion.duration: true
        service.task.execution.duration: true

logging:
  level:
    root: ${EASY_BPM_SERVER_LOGGING_LEVEL_ROOT:INFO}
    com.easy.bpm: ${EASY_BPM_SERVER_LOGGING_LEVEL_APP:DEBUG}
    org.hibernate: ${EASY_BPM_SERVER_LOGGING_LEVEL_HIBERNATE:WARN}
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %X{correlationId} - %msg%n"
  file:
    name: logs/bpm.log
    max-size: 10MB
    max-history: 10

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha

easybpm:
  authentication:
    provider: ${EASYBPM_AUTHENTICATION_PROVIDER:local}
    user-provisioning:
      enabled: ${EASYBPM_AUTHENTICATION_USER_PROVISIONING_ENABLED:true}
      default-permission-codes: ${EASYBPM_AUTHENTICATION_USER_PROVISIONING_DEFAULT_PERMISSION_CODES:ACCESS_PROCESS_PORTAL}
    oidc:
      issuer-uri: ${EASYBPM_OIDC_ISSUER_URI:}
      jwk-set-uri: ${EASYBPM_OIDC_JWK_SET_URI:}
      client-id: ${EASYBPM_OIDC_CLIENT_ID:easybpm}
      audience: ${EASYBPM_OIDC_AUDIENCE:}
      group-claim: ${EASYBPM_OIDC_GROUP_CLAIM:groups}
      username-claim: ${EASYBPM_OIDC_USERNAME_CLAIM:preferred_username}
      role-claim-paths:
        - realm_access.roles
        - resource_access.${EASYBPM_OIDC_CLIENT_ID:easybpm}.roles
      role-mappings:
        easybpm-admin: ACCESS_BPM_ADMIN
        easybpm-modeler: ACCESS_BPM_MODELER
        easybpm-user: ACCESS_PROCESS_PORTAL
        easybpm-admin-users-read: VIEW_USERS
        easybpm-admin-users-manage: MANAGE_USERS
        easybpm-admin-groups-read: VIEW_GROUPS
        easybpm-admin-groups-manage: MANAGE_GROUPS
        easybpm-admin-permissions-manage: MANAGE_PERMISSIONS
  test-data:
    enabled: ${EASY_BPM_TEST_DATA:${EASY_BPM_SERVER_TEST_DATA_ENABLED:false}}
    qa-resource-path: ${EASY_BPM_TEST_DATA_QA_RESOURCE_PATH:modeler-qa/qa-processes}
  retention:
    enabled: ${EASY_BPM_SERVER_RETENTION_ENABLED:false}
    completed-process-retention-days: ${EASY_BPM_SERVER_RETENTION_COMPLETED_PROCESS_RETENTION_DAYS:90}
    completed-task-retention-days: ${EASY_BPM_SERVER_RETENTION_COMPLETED_TASK_RETENTION_DAYS:90}
    batch-size: ${EASY_BPM_SERVER_RETENTION_BATCH_SIZE:500}
    cron: "${EASY_BPM_SERVER_RETENTION_CRON:0 0 3 * * *}"
  security:
    enabled: ${EASY_BPM_SERVER_SECURITY_ENABLED:true}
    jwt-secret: ${EASY_BPM_SERVER_SECURITY_JWT_SECRET:ZWFzeWJwbS1kZWZhdWx0LXNlY3JldC1tdXN0LWJlLWNoYW5nZWQ=}
    jwt-expiration-ms: ${EASY_BPM_SERVER_SECURITY_JWT_EXPIRATION_MS:3600000}
    bootstrap:
      admin-group-code: ${EASY_BPM_SERVER_SECURITY_BOOTSTRAP_ADMIN_GROUP_CODE:ADMIN}
      admin-group-name: ${EASY_BPM_SERVER_SECURITY_BOOTSTRAP_ADMIN_GROUP_NAME:Administrators}
      admin-username: ${EASY_BPM_SERVER_SECURITY_BOOTSTRAP_ADMIN_USERNAME:admin}
      admin-password: ${EASY_BPM_SERVER_SECURITY_BOOTSTRAP_ADMIN_PASSWORD:admin}
