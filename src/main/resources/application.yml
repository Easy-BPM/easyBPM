spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/easybpm}
    username: ${SPRING_DATASOURCE_USERNAME:meu_usuario}
    password: ${SPRING_DATASOURCE_PASSWORD:minha_senha}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:easybpm}
    password: ${SPRING_RABBITMQ_PASSWORD:easybpm}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,metrics,prometheus}
  endpoint:
    health:
      show-details: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:always}
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        process.execution.duration: true
        node.execution.duration: true
        task.completion.duration: true
        service.task.execution.duration: true

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.easy.bpm: ${LOGGING_LEVEL_COM_EASY_BPM:DEBUG}
    org.hibernate: ${LOGGING_LEVEL_ORG_HIBERNATE:WARN}
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %X{correlationId} - %msg%n"
  file:
    name: logs/bpm.log
    max-size: 10MB
    max-history: 10

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
