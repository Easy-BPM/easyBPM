services:
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: Easy_BPM_Keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${EASYBPM_KEYCLOAK_ADMIN:?Set EASYBPM_KEYCLOAK_ADMIN for local Keycloak}
      KEYCLOAK_ADMIN_PASSWORD: ${EASYBPM_KEYCLOAK_ADMIN_PASSWORD:?Set EASYBPM_KEYCLOAK_ADMIN_PASSWORD for local Keycloak}
      KC_HOSTNAME: ${EASYBPM_KEYCLOAK_PUBLIC_URL:-http://localhost:8081}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./deploy/keycloak/easybpm-realm.json:/opt/keycloak/data/import/easybpm-realm.json:ro
      - keycloak_data:/opt/keycloak/data

  backend:
    environment:
      EASYBPM_AUTHENTICATION_PROVIDER: keycloak
      EASYBPM_OIDC_ISSUER_URI: ${EASYBPM_OIDC_ISSUER_URI:-http://localhost:8081/realms/easybpm}
      EASYBPM_OIDC_JWK_SET_URI: ${EASYBPM_OIDC_JWK_SET_URI:-http://keycloak:8080/realms/easybpm/protocol/openid-connect/certs}
      EASYBPM_OIDC_CLIENT_ID: ${EASYBPM_OIDC_CLIENT_ID:-easybpm}
      EASYBPM_OIDC_AUDIENCE: ${EASYBPM_OIDC_AUDIENCE:-easybpm}
    depends_on:
      - keycloak

volumes:
  keycloak_data:
