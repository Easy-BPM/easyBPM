<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">Example Easy BPM worker throughput benchmark results</title>
  <desc id="desc">Bar chart comparing API tasks per second for one and three workers at 250 millisecond and 1000 millisecond mock API latency.</desc>
  <rect width="920" height="420" fill="#ffffff"/>
  <text x="40" y="42" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#111827">Example worker throughput benchmark</text>
  <text x="40" y="70" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#4b5563">Local Docker sample results. Your production numbers depend on deployment size, workflow shape, and external API latency.</text>

  <line x1="110" y1="340" x2="850" y2="340" stroke="#d1d5db" stroke-width="1"/>
  <line x1="110" y1="100" x2="110" y2="340" stroke="#d1d5db" stroke-width="1"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#6b7280">
    <text x="88" y="344" text-anchor="end">0</text>
    <text x="88" y="304" text-anchor="end">2</text>
    <text x="88" y="264" text-anchor="end">4</text>
    <text x="88" y="224" text-anchor="end">6</text>
    <text x="88" y="184" text-anchor="end">8</text>
    <text x="88" y="144" text-anchor="end">10</text>
    <text x="88" y="104" text-anchor="end">12</text>
  </g>

  <g stroke="#eef2f7" stroke-width="1">
    <line x1="110" y1="300" x2="850" y2="300"/>
    <line x1="110" y1="260" x2="850" y2="260"/>
    <line x1="110" y1="220" x2="850" y2="220"/>
    <line x1="110" y1="180" x2="850" y2="180"/>
    <line x1="110" y1="140" x2="850" y2="140"/>
    <line x1="110" y1="100" x2="850" y2="100"/>
  </g>

  <rect x="155" y="265" width="110" height="75" rx="4" fill="#2563eb"/>
  <rect x="320" y="122.4" width="110" height="217.6" rx="4" fill="#16a34a"/>
  <rect x="485" y="320.4" width="110" height="19.6" rx="4" fill="#2563eb"/>
  <rect x="650" y="281.4" width="110" height="58.6" rx="4" fill="#16a34a"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#111827" font-weight="700">
    <text x="210" y="254" text-anchor="middle">3.75/s</text>
    <text x="375" y="112" text-anchor="middle">10.88/s</text>
    <text x="540" y="310" text-anchor="middle">0.98/s</text>
    <text x="705" y="271" text-anchor="middle">2.93/s</text>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#374151">
    <text x="210" y="365" text-anchor="middle">1 worker</text>
    <text x="210" y="383" text-anchor="middle">250 ms</text>
    <text x="375" y="365" text-anchor="middle">3 workers</text>
    <text x="375" y="383" text-anchor="middle">250 ms</text>
    <text x="540" y="365" text-anchor="middle">1 worker</text>
    <text x="540" y="383" text-anchor="middle">1000 ms</text>
    <text x="705" y="365" text-anchor="middle">3 workers</text>
    <text x="705" y="383" text-anchor="middle">1000 ms</text>
  </g>

  <text x="28" y="225" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#6b7280" transform="rotate(-90 28 225)">API tasks per second</text>
</svg>
